name: ci

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

defaults:
  run:
    shell: "bash -euo pipefail {0}"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate matrix
        id: generate
        uses: docker/bake-action/subaction/matrix@v7
        with:
          target: tasks

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_version=$(jq < package.json -r .version)
          tag_version=${GITHUB_REF/#refs\/tags\/v/}
          if [[ ${tag_version:?} != "${package_version:?}" ]]; then
            echo "Error: git tag does not match package.json version" >&2
            declare -p GITHUB_REF tag_version package_version >&2
            exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # bake-action uses the HEAD git commit as context, not the checked-out files
      - name: Validate
        uses: docker/bake-action@v7
        with:
          targets: ${{ matrix.target }}

  package:
    runs-on: ubuntu-latest
    needs:
      - prepare
    permissions:
      # required to create attestations
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The package file names include the tag name when building a tag. The
      # bake file reads it from GITHUB_REF_TYPE and GITHUB_REF_NAME.
      - name: Build release packages
        uses: docker/bake-action@v7
        with:
          targets: package
          provenance: true

      - name: Rename package & attestation files
        run: |
          # Flatten the nested build output dirs and rename provenance. The
          # build generates provenance.json in each output dir which corresponds
          # to the .zip in each dir. We want the provenance file names to
          # contain the browser and version.

          for package in dist/packages/*/*.zip; do
            browser_dir=$(dirname "${package:?}")
            filename=$(basename "${package:?}")
            package_id=${filename/%.zip/}

            mv "${browser_dir:?}/provenance.json" "dist/${package_id:?}_provenance.json"
            mv "${browser_dir:?}"/*.zip "${browser_dir:?}"/*.sha256 dist/
          done

          ls -l dist

      - name: Create GitHub attestations
        uses: actions/attest@v4
        # Only create attestations for release artefacts, as regular branch
        # builds aren't stored long-term, and we don't expect people to use them
        # for anything serious.
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: |
            dist/headgear-*.zip
            dist/headgear-*.sha256
            dist/headgear-*_provenance.json

      - name: Store built extension packages
        uses: actions/upload-artifact@v7
        with:
          name: package_files
          path: |
            dist/headgear-*.zip
            dist/headgear-*.sha256
            dist/headgear-*_provenance.json
          if-no-files-found: error
          # We don't need to store these for long, as release artefacts get
          # added to the GitHub Releases we create.
          retention-days: 7

  github-release:
    runs-on: ubuntu-latest
    needs:
      - validate
      - package
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # required to create releases
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # gh release create needs the repo, and we read the release notes from
      # CHANGELOG.md.
      - name: Checkout
        uses: actions/checkout@v7

      - run: rm -rf dist

      - name: Download extension packages
        uses: actions/download-artifact@v8
        with:
          name: package_files
          path: dist

      - name: Validate GitHub attestations
        run: |
          files=(dist/*.zip dist/*.sha256 dist/*.json)
          if (( ${#files[@]} != 6 )); then
            { echo "Unexpected package files:"; find dist; declare -p files; } >&2
            exit 1
          fi

          for file in "${files[@]}"; do
            gh attestation verify "${file:?}" \
              --repo "${GITHUB_REPOSITORY:?}" \
              --signer-workflow "${GITHUB_WORKFLOW_REF:?}"
          done

      - name: Create GitHub Release
        run: |
          files=(dist/*.zip dist/*.sha256 dist/*.json)
          tag_name=${GITHUB_REF/#refs\/tags\//}  # remove the refs/tags/ prefix
          version=${tag_name/#v/}

          release_opts=()
          # Pre-release semver versions contain -, e.g. 1.2.3-beta.1
          if [[ ${tag_name:?} =~ [-] ]]; then
            release_opts+=(--prerelease)
          fi

          # Stable releases must have a CHANGELOG.md entry. Pre-releases
          # normally don't, so they fall back to generated notes.
          if scripts/changelog-release-notes.sh "${version:?}" > "${RUNNER_TEMP:?}/notes.md"; then
            release_opts+=(--notes-file "${RUNNER_TEMP:?}/notes.md")
          elif [[ ${tag_name:?} =~ [-] ]]; then
            release_opts+=(--generate-notes)
          else
            exit 1
          fi

          gh release create --verify-tag --draft \
            "${release_opts[@]}" "${tag_name:?}" "${files[@]}"
