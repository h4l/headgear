name: Submit extension release archive to Chrome Web Store

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: "bash -euo pipefail {0}"

jobs:
  submit:
    name: Submit GitHub Release version to Chrome Web Store
    runs-on: ubuntu-latest
    environment: Chrome Web Store
    # Pre-releases are not submitted, see scripts/cws-submit.sh
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'release'
      && github.event.release.prerelease)
    permissions:
      contents: read
      id-token: write # for Workload Identity Federation
    steps:
      - uses: actions/checkout@v7

      # Impersonate the service account that is registered with our Chrome Web
      # Store publisher account. The WIF provider only accepts OIDC tokens from
      # this repository's "Chrome Web Store" environment.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 900s
          create_credentials_file: false

      - name: Submit
        run: |
          scripts/cws-submit.sh "${TAG:?}"
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          CWS_PUBLISH_TYPE: ${{ vars.CWS_PUBLISH_TYPE }}
          TAG: ${{ github.ref_name }}
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
