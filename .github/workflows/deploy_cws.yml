name: Submit extension release archive to Chrome Web Store

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: "bash -euo pipefail {0}"

jobs:
  submit:
    name: Submit GitHub Release version to Chrome Web Store
    runs-on: ubuntu-latest
    environment: Chrome Web Store
    # Pre-releases are not submitted, see scripts/cws-submit.sh
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'release'
      && github.event.release.prerelease)
    steps:
      - uses: actions/checkout@v7

      - name: Submit
        run: |
          scripts/cws-submit.sh "${TAG:?}"
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          CWS_PUBLISH_TYPE: ${{ vars.CWS_PUBLISH_TYPE }}
          TAG: ${{ github.ref_name }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
